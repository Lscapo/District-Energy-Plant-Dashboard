<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>OSLU Plant Rounds Dashboard</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#eef1f0;--card:#ffffff;--text:#1A2E2C;--text2:#3d4b49;--text3:#566462;
  --border:#d8dedc;--input-bg:#ffffff;--input-border:#7d8b89;
  --warm:#B5500A;--warm-l:#FDEBD0;--warm-alt:#FEF6EE;--warm-g:#F0C0A0;--warm-t:#6B2E00;
  --cool:#1565A0;--cool-l:#D6EAF8;--cool-alt:#EEF6FD;--cool-g:#90C0E0;--cool-t:#0D3F6B;
  --teal:#1A7A6E;--teal-l:#E0F4F1;--teal-alt:#F0FAF8;--teal-g:#A8D5CC;--teal-t:#0F5A50;
  --ok:#1A7A3C;--off:#444444;--danger:#C0392B;--danger-text:#A32A1E;--danger-bg:#FBE4E1;
  --on-solid:#ffffff;
  --grad:linear-gradient(90deg,#0A6C96 0%,#12796D 50%,#3C7D22 100%);
  --card-shadow:0 1px 4px rgba(0,0,0,.10);--btn-shadow:0 1px 2px rgba(0,0,0,.20);--bar-shadow:0 -2px 10px rgba(0,0,0,.10);
  --toast-bg:#1A2E2C;--toast-text:#ffffff;--scrim:rgba(0,0,0,.55);
  --r:8px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1514;--card:#172220;--text:#e8f0ee;--text2:#bccac7;--text3:#9bacaa;
    --border:#2c3b38;--input-bg:#0f1918;--input-border:#6f817e;
    --warm:#B5500A;--warm-l:#3a2412;--warm-alt:#1f1b17;--warm-g:#6b4220;--warm-t:#f6cfaa;
    --cool:#1565A0;--cool-l:#15314b;--cool-alt:#18232c;--cool-g:#2d5a7e;--cool-t:#aad3f3;
    --teal:#1A7A6E;--teal-l:#123733;--teal-alt:#162a28;--teal-g:#2c6a62;--teal-t:#a3ded4;
    --danger-text:#ffa196;--danger-bg:#4a1f1a;
    --card-shadow:0 1px 5px rgba(0,0,0,.55);--btn-shadow:0 1px 3px rgba(0,0,0,.65);--bar-shadow:0 -2px 12px rgba(0,0,0,.6);
    --toast-bg:#e8f0ee;--toast-text:#0e1514;
  }
}
/* ---- dashboard-only tokens (the shared palette above is copied verbatim from the field app) ---- */
:root{--ok-bg:#DDF3E4;--ok-text:#14532D;--chart-grid:#c9d1cf;--band:#cfe8e3;}
@media (prefers-color-scheme:dark){:root{--ok-bg:#12331f;--ok-text:#a8e6bd;--chart-grid:#33423f;--band:#1d4a43;}}
*{box-sizing:border-box;margin:0;padding:0;}
[hidden]{display:none !important;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','SF Pro Text',Roboto,sans-serif;font-size:14px;line-height:1.4;background:var(--bg);color:var(--text);min-height:100vh;}
button,input,select{font-family:inherit;}
.top{background:var(--grad);color:var(--on-solid);padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;}
.top h1{font-size:20px;font-weight:700;}
.top p{font-size:13px;}
.ver{font-weight:700;white-space:nowrap;}
.topr{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;font-weight:600;}
.tbtn{min-height:44px;padding:0 14px;border-radius:var(--r);border:1.5px solid var(--input-border);background:var(--card);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;box-shadow:var(--btn-shadow);}
.tbtn:active{box-shadow:none;transform:translateY(1px);}
.tbtn.on{background:var(--danger);border-color:var(--danger);color:var(--on-solid);}
.banner{padding:12px 20px;font-size:14px;font-weight:700;background:var(--warm-l);color:var(--warm-t);border-bottom:2px solid var(--warm);}
.banner.err{background:var(--danger);color:var(--on-solid);border-color:var(--danger);}
.alerts{background:var(--danger);color:var(--on-solid);padding:12px 20px;}
.alerts h2{font-size:15px;margin-bottom:6px;}
.alerts ul{list-style:none;display:flex;flex-direction:column;gap:3px;font-size:14px;font-weight:600;}
.tabs{display:flex;background:var(--card);border-bottom:2px solid var(--border);position:sticky;top:0;z-index:20;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;min-height:48px;padding:0 22px;font-size:14px;font-weight:700;border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;color:var(--text3);}
.tab.act{color:var(--teal-t);border-bottom-color:var(--teal);background:var(--teal-l);}
.wrap{max-width:1560px;margin:0 auto;padding:16px 20px 60px;}
.pane{display:none;}
.pane.act{display:block;}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--card-shadow);margin-bottom:16px;overflow:hidden;}
.card>h2{padding:12px 16px;font-size:15px;font-weight:700;color:var(--on-solid);}
.card>h2.c{background:var(--cool);}.card>h2.w{background:var(--warm);}.card>h2.t{background:var(--teal);}
.card>h2 small{font-weight:600;margin-left:8px;font-size:13px;}
.pad{padding:14px 16px;}
.note{font-size:13px;color:var(--text2);line-height:1.5;}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:16px;}
.tile{background:var(--card);border-radius:var(--r);box-shadow:var(--card-shadow);padding:14px 16px;border-left:6px solid var(--teal);}
.tile.ok{border-left-color:var(--ok);}.tile.warn{border-left-color:var(--warm);}.tile.late,.tile.bad{border-left-color:var(--danger);}
.tile .k{font-size:13px;color:var(--text2);font-weight:600;}
.tile .v{font-size:30px;font-weight:700;line-height:1.15;margin:2px 0;}
.tile .s{font-size:13px;color:var(--text2);}
.chip{display:inline-block;padding:2px 10px;border-radius:12px;font-size:13px;font-weight:700;white-space:nowrap;}
.chip.ok{background:var(--ok-bg);color:var(--ok-text);}
.chip.warn{background:var(--warm-l);color:var(--warm-t);}
.chip.late,.chip.bad{background:var(--danger);color:var(--on-solid);}
.chip.none{background:var(--card);color:var(--text2);border:1px dashed var(--input-border);}
.chip.info{background:var(--cool-l);color:var(--cool-t);}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr);}}
.hxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;padding:14px 16px;}
.hxcard{border:1px solid var(--border);border-radius:var(--r);padding:12px;background:var(--card);}
.hxcard.bad{border:2px solid var(--danger);}
.hxcard h3{font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.hxcard h3 small{font-size:13px;color:var(--text2);font-weight:600;}
.hxnums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0;}
.hxnums div{font-size:13px;color:var(--text2);}
.hxnums b{display:block;font-size:20px;color:var(--text);line-height:1.2;}
.chart{display:block;width:100%;height:auto;touch-action:pan-y;cursor:crosshair;}
.chart:focus-visible,.spark:focus-visible{outline:2px solid var(--teal-t);outline-offset:2px;border-radius:4px;}
.xh line{stroke:var(--text2);stroke-width:1.2;stroke-dasharray:3 3;}
.xh circle{fill:var(--card);stroke:var(--text);stroke-width:2.5;}
.tip{position:fixed;z-index:600;background:var(--toast-bg);color:var(--toast-text);padding:8px 12px;border-radius:8px;font-size:13px;line-height:1.45;pointer-events:none;max-width:270px;box-shadow:var(--card-shadow);}
.tip b{display:block;margin-bottom:2px;}
.tip .tipsub{opacity:1;margin-top:3px;border-top:1px solid var(--chart-grid);padding-top:3px;font-size:12px;}
.ax{font-size:12px;fill:var(--text3);}
.l-act{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;}
.l-cool{stroke:var(--cool);}.l-heat{stroke:var(--warm);}
.l-sp{fill:none;stroke:var(--text2);stroke-width:1.8;stroke-dasharray:5 4;}
.dot-cool{fill:var(--cool);}.dot-heat{fill:var(--warm);}
.band{fill:var(--band);}
.grid-l{stroke:var(--chart-grid);stroke-width:1;}
.lgnd{display:flex;gap:14px;font-size:12px;color:var(--text2);margin-top:2px;flex-wrap:wrap;}
.lgnd i{display:inline-block;width:18px;height:0;border-top:3px solid var(--cool);vertical-align:middle;margin-right:5px;}
.lgnd i.h{border-top-color:var(--warm);}.lgnd i.d{border-top:2px dashed var(--text2);}
.donutwrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:14px 16px;}
.donut{width:150px;height:150px;flex:0 0 auto;}
.donut .num{font-size:28px;font-weight:700;fill:var(--text);}
.donut .lab{font-size:12px;fill:var(--text3);}
.s-R{stroke:var(--ok);}.s-O{stroke:var(--off);}.s-F{stroke:var(--danger);}.s-N{stroke:var(--chart-grid);}
.legend{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px;}
.legend b{font-size:18px;margin-right:6px;}
.legend .sw{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:8px;vertical-align:-2px;}
.sw.R{background:var(--ok);}.sw.O{background:var(--off);}.sw.F{background:var(--danger);}.sw.N{background:var(--chart-grid);}
.lc{padding:12px 16px;}
.lc h3{font-size:13px;color:var(--text2);margin:10px 0 6px;font-weight:700;}
.lc h3:first-child{margin-top:0;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.scrollx{overflow-x:auto;}
table{border-collapse:collapse;width:100%;font-size:14px;}
th{font-size:13px;text-align:left;color:var(--text2);font-weight:700;padding:6px 8px;border-bottom:2px solid var(--border);white-space:nowrap;}
td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
tbody tr:nth-child(even) td{background:var(--teal-alt);}
.hm th,.hm td{text-align:center;}
.hm th:first-child,.hm td:first-child{text-align:left;font-weight:700;white-space:nowrap;}
.hm td{min-width:64px;font-variant-numeric:tabular-nums;}
.hm .flag{background:var(--danger) !important;color:var(--on-solid);font-weight:700;}
.hm .unusual{background:var(--warm-l) !important;color:var(--warm-t);font-weight:700;}
.hm .na{color:var(--text3);}
.hm .sR{background:var(--ok-bg) !important;color:var(--ok-text);font-weight:700;}
.hm .sO{color:var(--text2);font-weight:700;}
.hm h3{font-size:14px;}
.sechead{font-size:16px;font-weight:700;margin:18px 0 8px;display:flex;gap:10px;align-items:baseline;}
.sechead small{font-size:13px;color:var(--text2);font-weight:600;}
.ucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
.ucard{position:relative;background:var(--card);border-radius:var(--r);box-shadow:var(--card-shadow);padding:12px;overflow:hidden;}
.ucard h3{min-height:28px;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center;}
.ucard.fault{border:2px solid var(--danger);}
.ucard .oos{margin:-12px -12px 8px;padding:6px 12px;background:var(--danger);color:var(--on-solid);font-weight:700;font-size:13px;}
.ucard dl{display:grid;grid-template-columns:auto auto;gap:2px 10px;font-size:13px;margin:8px 0;}
.ucard dt{color:var(--text2);}.ucard dd{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;}
.spark{display:block;width:100%;height:auto;touch-action:pan-y;cursor:crosshair;}
.cap{font-size:12px;color:var(--text3);}
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;padding:12px 16px;border-bottom:1px solid var(--border);}
.filters label{font-size:13px;font-weight:700;color:var(--text2);display:flex;flex-direction:column;gap:3px;}
.filters input,.filters select,.fld{border:1.5px solid var(--input-border);border-radius:6px;padding:8px 10px;font-size:14px;min-height:44px;background:var(--input-bg);color:var(--text);}
.filters .chk{flex-direction:row;align-items:center;gap:8px;min-height:44px;}
.filters .chk input{width:20px;height:20px;min-height:0;}
.btn{min-height:44px;padding:0 16px;border-radius:var(--r);border:none;font-size:14px;font-weight:700;cursor:pointer;background:var(--teal-l);color:var(--teal-t);box-shadow:var(--btn-shadow);}
.btn:active{box-shadow:none;transform:translateY(1px);}
.btn.pri{background:var(--grad);color:var(--on-solid);}
.btn.del{background:var(--danger);color:var(--on-solid);min-height:36px;padding:0 12px;}
.btn[disabled]{filter:grayscale(.6);cursor:default;}
.notes{max-width:420px;white-space:pre-wrap;word-break:break-word;}
details.dd summary{cursor:pointer;color:var(--teal-t);font-weight:700;}
.flagl{color:var(--danger-text);font-weight:700;}
.set input.fld{width:90px;text-align:center;}
.set td:first-child{min-width:230px;font-weight:600;}
code{font-size:12px;color:var(--text2);word-break:break-all;}
.empty{padding:26px 16px;font-size:15px;color:var(--text2);line-height:1.5;}
.modal{position:fixed;inset:0;background:var(--scrim);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px;}
.mbox{background:var(--card);color:var(--text);border-radius:12px;padding:20px;width:100%;max-width:440px;box-shadow:var(--card-shadow);}
.mbox h2{font-size:17px;margin-bottom:8px;}
.mbox p{font-size:13px;line-height:1.5;color:var(--text2);margin-bottom:10px;}
.mbox label{font-size:13px;font-weight:700;display:block;margin-bottom:4px;}
.mbox input{width:100%;border:1.5px solid var(--input-border);border-radius:6px;padding:10px;font-size:16px;min-height:44px;background:var(--input-bg);color:var(--text);margin-bottom:12px;}
.mrow{display:flex;gap:8px;flex-wrap:wrap;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-text);padding:12px 20px;border-radius:24px;font-size:14px;font-weight:600;z-index:500;opacity:0;transition:opacity .3s;pointer-events:none;width:max-content;max-width:90vw;text-align:center;}
.toast.on{opacity:1;}
:focus-visible{outline:2px solid var(--teal-t);outline-offset:2px;}
@media (max-width:600px){.wrap{padding:12px 10px 50px;}.top{padding:12px;}.hxgrid{padding:10px;grid-template-columns:minmax(0,1fr);}.tile .v{font-size:26px;}}
.mbox.wide{max-width:940px;max-height:92vh;overflow:auto;}
.mbox textarea{width:100%;margin-bottom:12px;font-size:15px;font-family:inherit;line-height:1.4;resize:vertical;}
.efind{display:block;margin-bottom:10px;}
.egrp{border:1px solid var(--border);border-radius:var(--r);padding:8px 12px 12px;margin:0 0 10px;}
.egrp legend{font-size:14px;font-weight:700;padding:0 6px;color:var(--teal-t);}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 12px;}
.efld{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:600;color:var(--text2);margin:0;}
.efld .fld{width:100%;font-size:15px;padding:8px;min-height:44px;margin:0;}
.fld.chg{border-color:var(--warm);box-shadow:0 0 0 3px var(--warm-g);}
.anote{margin-top:6px;font-size:13px;color:var(--text);}
.alerts .anotes{margin-top:8px;padding-top:8px;border-top:1px solid var(--on-solid);font-weight:400;}
.acts{white-space:nowrap;}
.acts .btn{min-height:36px;padding:0 10px;}
</style>
</head>
<body>
<header class="top">
  <div><h1>ONNI South Lake Union · District Energy</h1><p>Plant rounds dashboard · Capilano Energy · <span class="ver" id="ver"></span></p></div>
  <div class="topr">
    <span id="upd">Not loaded yet</span><span id="cd"></span>
    <button class="tbtn" id="btn-refresh">Refresh now</button>
    <button class="tbtn" id="btn-token">Token</button>
    <button class="tbtn" id="btn-admin" aria-pressed="false">Admin mode: off</button>
  </div>
</header>
<div class="banner" id="stale" role="status" hidden></div>
<div class="alerts" id="alerts" role="alert" hidden></div>
<nav class="tabs" aria-label="Sections">
  <button class="tab act" data-t="over">Overview</button>
  <button class="tab" data-t="equip">Equipment</button>
  <button class="tab" data-t="hist">History</button>
  <button class="tab" data-t="set">Settings</button>
</nav>
<main class="wrap">
  <section class="pane act" id="p-over"></section>
  <section class="pane" id="p-equip"></section>
  <section class="pane" id="p-hist">
    <div class="card">
      <h2 class="t">Round history<small id="hcount"></small></h2>
      <div class="filters">
        <label>From<input type="date" id="f-from"></label>
        <label>To<input type="date" id="f-to"></label>
        <label>Round<select id="f-round"><option value="">All</option></select></label>
        <label>Tested by<input type="text" id="f-op" placeholder="Name"></label>
        <label>Notes contain<input type="text" id="f-q" placeholder="Search notes"></label>
        <label class="chk"><input type="checkbox" id="f-flags"> Flagged rounds only</label>
        <button class="btn pri" id="btn-csv">Export CSV</button>
      </div>
      <div class="scrollx"><table><thead id="hhead"></thead><tbody id="hbody"></tbody></table></div>
      <div class="filters"><button class="btn" id="hmore" hidden>Show more</button><button class="btn" id="btn-older">Load one older month</button><span class="note" id="hfiles"></span></div>
    </div>
  </section>
  <section class="pane" id="p-set"></section>
</main>
<div class="modal" id="editmodal" hidden>
  <div class="mbox wide" role="dialog" aria-modal="true" aria-labelledby="ed-h">
    <h2 id="ed-h"></h2>
    <p id="ed-sub"></p>
    <div id="ed-fields"></div>
    <p class="note" id="ed-sum" aria-live="polite"></p>
    <label for="ed-by">Your name</label>
    <input type="text" id="ed-by" maxlength="60" autocomplete="off">
    <label for="ed-text" id="ed-textlabel"></label>
    <textarea id="ed-text" class="fld" rows="3" maxlength="600"></textarea>
    <p class="flagl" id="ed-err" role="alert" hidden></p>
    <div class="mrow"><button class="btn pri" id="ed-save">Save</button><button class="btn" id="ed-cancel">Cancel</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="tip" id="tip" role="tooltip" hidden></div>
<div class="modal" id="tokmodal" hidden>
  <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="tok-h">
    <h2 id="tok-h">Data token</h2>
    <p id="tok-state"></p>
    <label for="tok-in">Paste the access token</label>
    <input type="password" id="tok-in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="mrow"><button class="btn pri" id="tok-save">Save token</button><button class="btn" id="tok-clear">Remove token</button><button class="btn" id="tok-close">Close</button></div>
  </div>
</div>

<script>
// ===== CONFIG =====
var GH_REPO='Lscapo/District-Energy-Plant-Data', GH_BRANCH='data';
var GH_TOKEN=''; try{GH_TOKEN=localStorage.getItem('oslu-token')||'';}catch(e){}
// ===== GH CORE BEGIN (shared by field app + dashboard) =====
// The page defines GH_REPO ('owner/repo'), GH_BRANCH ('data') and GH_TOKEN (string, may be empty).
// Every write follows one rule: fetch the CURRENT remote file, apply a small ID-based change
// to that fresh copy, PUT with the SHA from that same fetch. Local copies are never a write base.
function ghUrl(file){return 'https://api.github.com/repos/'+GH_REPO+'/contents/'+file+'?ref='+GH_BRANCH;}
function ghPutUrl(file){return 'https://api.github.com/repos/'+GH_REPO+'/contents/'+file;}
function monthFile(dateIso){var m=/^(\d{4})-(\d{2})-\d{2}$/.exec(String(dateIso||''));return m?'data-'+m[1]+'-'+m[2]+'.json':null;}
function b64ToUtf8(b){
  var bin=atob(String(b).replace(/\s/g,''));
  var bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function utf8ToB64(s){return btoa(unescape(encodeURIComponent(s)));}
function stripLocal(e){var c={};for(var k in e){if(k!=='synced')c[k]=e[k];}return c;}

// One timer covers the whole request INCLUDING reading the body (a stalled body hangs forever otherwise)
async function ghRequest(url,opts,ms){
  var c=new AbortController();
  var t=setTimeout(function(){c.abort();},ms);
  try{
    var r=await fetch(url,Object.assign({cache:'no-store',signal:c.signal},opts));
    var text=await r.text();
    return{status:r.status,ok:r.ok,text:text};
  }finally{clearTimeout(t);}
}
function ghHdr(accept,json){
  var h={'Authorization':'token '+GH_TOKEN,'Accept':accept||'application/vnd.github.v3+json'};
  if(json)h['Content-Type']='application/json';
  return h;
}

async function ghFetchRemote(file){
  if(!GH_TOKEN)return{ok:false,reason:'notoken'};
  try{
    var r=await ghRequest(ghUrl(file),{headers:ghHdr()},5000);
    if(r.status===404)return{ok:true,list:[],sha:null,missing:true};

async function ghPut(file,list,sha,message){

// mutator(remoteList) -> null (nothing to change) or {list, added, removed}
async function ghMutate(file,mutator,message){
  if(!GH_TOKEN)return{ok:false,reason:'notoken'};
  for(var attempt=0;attempt<3;attempt++){
    var rem=await ghFetchRemote(file);
    if(!rem.ok)return{ok:false,reason:rem.reason,status:rem.status};
    var plan=mutator(rem.list);
    if(!plan)return{ok:true,changed:false,list:rem.list};
    // Safety guard: the write may only add/remove exactly what the mutator says it does
    var keep=new Set(plan.list),lost=0;
    for(var i=0;i<rem.list.length;i++){if(!keep.has(rem.list[i]))lost++;}
    var added=plan.list.length-(rem.list.length-lost);
    if(lost!==(plan.removed||0)||added!==(plan.added||0))return{ok:false,reason:'guard'};
    var w=await ghPut(file,plan.list,rem.sha,message);
    if(w.ok)return{ok:true,changed:true,list:plan.list};
    if(w.status===409||w.status===422)continue; // someone wrote first: re-fetch, re-apply, retry
    if(w.status===401)return{ok:false,reason:'auth',status:401};
    return{ok:false,reason:w.status?'http':'network',status:w.status};

}

async function ghDeleteById(file,id){

    var out=remote.filter(function(r){return!(r&&r.id===id);});
    var gone=remote.length-out.length;
    if(gone===0)return null;
    return{list:out,added:0,removed:1}; // guard compares this claim (1) with what really disappears
  },'Delete round '+id);
}

// Plain-language text for every failure reason (never a generic "offline")
function ghExplain(r){
  if(!r||r.ok)return '';
  if(r.reason==='notoken')return 'No token set';
  if(r.reason==='auth')return 'Token rejected (401). Tap Token to change it';
  if(r.reason==='http'){
    if(r.status===403)return 'Token lacks permission, or GitHub rate limit reached (403)';
    if(r.status===404)return 'Data repo or branch not found, or token has no access to it (404)';
    return 'GitHub returned an error ('+r.status+')';
  }
  if(r.reason==='format')return 'Data file has a format problem. Nothing was written';
  if(r.reason==='guard')return 'Safety check blocked the write. Nothing was written';
  if(r.reason==='conflict')return 'Another device was writing. Will retry';
  if(r.reason==='network')return 'No signal, or the request timed out';
  return 'Sync problem ('+r.reason+')';
}

    flat.forEach(function(f){if(/^(revisions|admin_notes)\b/.test(f.path))return;m[f.path]=f.value;if(lead.indexOf(f.path)<0&&f.path!=='notes'&&!seen[f.path]){seen[f.path]=1;cols.push(f.path);}});

  });

  var out=[all.map(csvCell).join(',')];

// ---- limits.json edits: ID-based, applied to the FRESH remote copy; first save seeds the starting rules ----
function planRuleEdits(remote,upserts,removes,defaults){
  var seeded=!remote.length,out=seeded?clone(defaults):remote.slice();
  var fromRemote=new Set(seeded?[]:remote),added=seeded?out.length:0,removed=0;
  upserts.forEach(function(u){

}

// ---- IMPORT: files saved by the ORIGINAL app (pretty-printed form data, every value is text) -> current record shape ----
var LEGACY_STRING_KEYS=['lead_tower','chem_feeder_status','mode','running_pump','shift','operator','time','date','filename','unit','pump','zone'];
var ROUND_SECTIONS=['chiller_plant','condenser_water_pumps','cooling_hx','cool_loop','cooling_tower','boiler_plant','feedwater_pumps','heating_hx','heat_loop','dhw_tank','hrc','hrc_pumps'];
function legacyValue(key,v){
  if(v===null||v===undefined)return null;
  if(key==='notes')return String(v);
  if(typeof v==='number')return isFinite(v)?v:null;
  if(typeof v!=='string')return v;
  var s=v.trim();
  if(s===''||s==='-')return null;
  if(key==='status'&&(s==='R'||s==='O'||s==='F'))return s;   // equipment status stays a letter; HRC status (a %) becomes a number
  if(LEGACY_STRING_KEYS.indexOf(key)>=0)return v;

}
function legacyWalk(o,key){

  if(o&&typeof o==='object'){var out={};for(var k in o)out[k]=legacyWalk(o[k],k);return out;}

// two independent 32-bit hashes -> a stable id suffix: the same file always gets the same id, so re-importing never duplicates
function hash12(str){

  for(var i=0;i<str.length;i++){var c=str.charCodeAt(i);h1^=c;h1=Math.imul(h1,16777619)>>>0;h2=(Math.imul(h2,33)+c)>>>0;}
  return(h1.toString(36)+h2.toString(36)).padStart(12,'0');

// -> {ok:true, record} or {ok:false, reason}
function convertLegacy(obj){

  if(typeof obj.id==='string'&&obj.schema&&/^\d{4}-\d{2}-\d{2}$/.test(String(obj.meta.date||'')))return{ok:true,record:obj,passthrough:true};   // already in the current format
  if(!ROUND_SECTIONS.some(function(k){return obj[k]!==undefined;}))return{ok:false,reason:'No equipment sections found'};
  var ds=String(obj.meta.date===undefined||obj.meta.date===null?'':obj.meta.date).trim();
  var m=/^(\d{4})(\d{2})(\d{2})$/.exec(ds)||/^(\d{4})-(\d{2})-(\d{2})$/.exec(ds);

  var tm=/^(\d{1,2}):(\d{2})/.exec(String(meta.time||'')),rat;
  try{rat=new Date(y,mo-1,da,tm?+tm[1]:0,tm?+tm[2]:0).toISOString();}catch(e){rat=meta.date+'T00:00:00.000Z';}
  var out={schema:1,id:'pr-'+m[1]+m[2]+m[3]+'-R'+round+'-i'+hash12(JSON.stringify(obj)),recorded_at:rat,app_version:'import v1 (original app)',meta:meta};

function groupByMonth(records){var g={};records.forEach(function(r){var f=monthFile(r.meta&&r.meta.date);if(f)(g[f]=g[f]||[]).push(r);});return g;}
// adds only the records whose id is not already on the server; nothing else is touched
function planImport(remote,records){
  var ids=new Set();for(var i=0;i<remote.length;i++)ids.add(remote[i]&&remote[i].id);
  var add=records.filter(function(r){return!ids.has(r.id);});
  if(!add.length)return null;

}
function monthsNeeded(oldestIso,now){var m=/^(\d{4})-(\d{2})/.exec(oldestIso||'');if(!m)return 3;return Math.max(1,(now.getFullYear()-(+m[1]))*12+(now.getMonth()+1-(+m[2]))+1);}

// ---- ADMIN: notes and corrections on recorded rounds (Admin mode on the dashboard) ----
// A round may carry  admin_notes:[{at,by,text}]  and  revisions:[{at,by,reason,changes:[{path,from,to}]}].
// Nothing is ever overwritten without a trace: every correction keeps the old value, who changed it, when, and why.
function adminNotesText(r){return(r.admin_notes||[]).map(function(n){return n.at+' '+(n.by||'')+': '+n.text;}).join(' | ');}
function editsText(r){return(r.revisions||[]).map(function(v){return v.at+' '+(v.by||'')+': '+v.reason+' ['+(v.changes||[]).map(function(c){return c.path+' '+dv(c.from)+' -> '+dv(c.to);}).join('; ')+']';}).join(' | ');}
function sameVal(a,b){if(a===undefined)a=null;if(b===undefined)b=null;return a===b;}
function setPath(o,path,v){
  var segs=String(path).split('.'),last=segs.pop(),cur=o;
  for(var i=0;i<segs.length;i++){
    if(cur===null||cur===undefined)return false;
    var m=/^([^\[]+)(?:\[(.*)\])?$/.exec(segs[i]);if(!m)return false;
    cur=cur[m[1]];
    if(m[2]!==undefined){if(!Array.isArray(cur))return false;var nm=m[2];cur=cur.find(function(it){return itemName(it)===nm;});}
  }

  cur[last]=v;return true;
}
// e: {changes:[{path,from,to}], reason, by, at}. Every change is checked against the CURRENT copy first: if somebody else
// changed that value since this admin opened the round, nothing is applied.
function applyEdit(rec,e){
  if(!e.reason||!String(e.reason).trim())return{ok:false,reason:'noreason'};
  if(!e.changes||!e.changes.length)return{ok:false,reason:'nochange'};
  var out=clone(rec);
  for(var i=0;i<e.changes.length;i++){
    var c=e.changes[i];
    if(!sameVal(getPath(out,c.path),c.from))return{ok:false,reason:'conflict',path:c.path};
    if(!setPath(out,c.path,c.to))return{ok:false,reason:'missing',path:c.path};
  }
  out.revisions=(out.revisions||[]).concat([{at:e.at,by:e.by||'',reason:String(e.reason).trim(),changes:clone(e.changes)}]);
  return{ok:true,record:out};
}
function applyNote(rec,n){
  if(!n.text||!String(n.text).trim())return{ok:false,reason:'noreason'};
  var out=clone(rec);out.admin_notes=(out.admin_notes||[]).concat([{at:n.at,by:n.by||'',text:String(n.text).trim()}]);
  return{ok:true,record:out};
}
// Replace exactly one record, by id, in the FRESH remote copy of its month file.
async function changeRound(id,file,produce){
  var problem=null;
  var res=await ghMutate(file,function(rem){
    var i=rem.findIndex(function(r){return r&&r.id===id;});
    if(i<0){problem={reason:'gone'};return null;}
    var p=produce(rem[i]);if(!p.ok){problem=p;return null;}
    var list=rem.slice();list[i]=p.record;
    return{list:list,added:1,removed:1};
  },'Edit round '+id);
  if(!res.ok)return res;
  if(problem)return{ok:false,reason:'edit-'+problem.reason,detail:problem};
  return{ok:true};
}
// A corrected date can belong to a different month file: write it to the new month first, then remove the old copy.
// If the second step fails the round exists in both months for a moment; dedupeById keeps the corrected one, and pressing Save again finishes the job.
async function moveRound(id,oldFile,newFile,produce){
  var cur=await ghFetchRemote(oldFile);if(!cur.ok)return cur;
  var old=cur.list.find(function(r){return r&&r.id===id;});if(!old)return{ok:false,reason:'edit-gone'};
  var p=produce(old);if(!p.ok)return{ok:false,reason:'edit-'+p.reason,detail:p};
  var base=JSON.stringify(old);
  var r1=await ghMutate(newFile,function(rem){
    var i=rem.findIndex(function(r){return r&&r.id===id;});
    if(i>=0){var l=rem.slice();l[i]=p.record;return{list:l,added:1,removed:1};}
    return{list:rem.concat([p.record]),added:1,removed:0};
  },'Move corrected round '+id);
  if(!r1.ok)return r1;
  var changed=false;
  var r2=await ghMutate(oldFile,function(rem){
    var i=rem.findIndex(function(r){return r&&r.id===id;});if(i<0)return null;
    if(JSON.stringify(rem[i])!==base){changed=true;return null;}   // someone edited the old copy meanwhile: leave it, do not lose their change
    return{list:rem.filter(function(r){return!(r&&r.id===id);}),added:0,removed:1};
  },'Remove moved round '+id);
  if(!r2.ok||changed)return{ok:false,reason:'edit-partial',detail:r2};
  return{ok:true,moved:true};
}
// the same id in two month files (an interrupted move): keep the copy with more corrections
function dedupeById(items){
  var by={},order=[];
  items.forEach(function(it){
    var k=it.rec.id,cur=by[k];
    if(!cur){by[k]=it;order.push(k);}
    else if((it.rec.revisions||[]).length>(cur.rec.revisions||[]).length)by[k]=it;
  });
  return order.map(function(k){return by[k];});
}
// ---- which values the edit form offers, and how they are typed ----
var EDIT_SKIP_TOP=['schema','id','recorded_at','app_version','revisions','admin_notes'];
function leafType(path,value){
  var key=path.split('.').pop();
  if(path==='meta.date')return'date';
  if(path==='meta.time')return'time';
  if(path==='meta.round')return'int';
  if(key==='status')return(typeof value==='number'||(value===null&&/^hrc\./.test(path)))?'num':'status';
  if(typeof value==='number')return'num';
  if(typeof value==='string'||key==='notes'||LEGACY_STRING_KEYS.indexOf(key)>=0)return'str';
  return'num';
}
function leafGroup(path){
  var i=path.indexOf(']');
  if(i>=0)return{id:path.slice(0,i+1),key:path.slice(i+2)};
  var j=path.lastIndexOf('.');
  return j<0?{id:'general',key:path}:{id:path.slice(0,j),key:path.slice(j+1)};
}
function groupTitle(id){
  if(id==='meta')return'Round details';
  if(id==='general')return'Notes';
  var m=/^(.*)\[(.*)\]$/.exec(id),sec;
  if(m){sec=SECTIONS.filter(function(s){return s.path===m[1];})[0];return(sec?sec.title:m[1].replace(/[_.]/g,' '))+' · '+m[2];}
  sec=SECTIONS.filter(function(s){return s.path===id;})[0];
  return sec?sec.title:id.replace(/_/g,' ').replace(/\./g,' › ');
}
function editableLeaves(rec){
  return flattenRec(rec,'',[]).filter(function(f){
    var top=f.path.split(/[.\[]/)[0],key=f.path.split('.').pop();
    return EDIT_SKIP_TOP.indexOf(top)<0&&NAME_KEYS.indexOf(key)<0;
  }).map(function(f){var g=leafGroup(f.path);return{path:f.path,value:f.value,type:leafType(f.path,f.value),group:g.id,key:g.key};});
}

<script>
(function() {

  try { S.admin = localStorage.getItem(ADMIN_KEY) === '1'; } catch (e) {}

      for (var i = 0; i < files.length; i++) {

      S.records = sortRecords(all); S.fileOf = fileOf; S.sizes = sizes; S.allMissing = (missing === files.length);

  }

  // ── SVG CHARTS (no library: drawn from CSS variables, so light/dark follows the theme) ──

  }

    for (i = 0; i < files.length; i++) {
      var obj;
      try { obj = JSON.parse((await files[i].text()).replace(/^\uFEFF/, '')); } catch (e) { m.invalid.push({ name: files[i].name, reason: 'Not valid JSON' }); continue; }
      (Array.isArray(obj) ? obj : [obj]).forEach(function(it) {
        var c = convertLegacy(it);
        if (!c.ok) { m.invalid.push({ name: files[i].name, reason: c.reason }); return; }
        if (seen[c.record.id]) { dups++; return; }
        seen[c.record.id] = 1; valid.push(c.record);
      });
    }
    if (dups) m.warnings.push(dups + ' file' + (dups === 1 ? ' was' : 's were') + ' an exact copy of another selected file and will be imported once.');
    if (!valid.length) { m.busy = false; m.msg = 'No usable rounds found in the ' + files.length + ' selected files.'; renderImport(); return; }
    if (!GH_TOKEN) { m.busy = false; m.msg = 'No token set. Add the token first, then choose the files again.'; renderImport(); return; }
    m.recs = groupByMonth(valid);
    var dates = valid.map(function(r) { return r.meta.date; }).sort(); m.oldest = dates[0]; m.newest = dates[dates.length - 1];
    var today = new Date(), todayIso = today.getFullYear() + '-' + pad2(today.getMonth() + 1) + '-' + pad2(today.getDate()), fut = valid.filter(function(r) { return r.meta.date > todayIso; }).length;
    if (fut) m.warnings.push(fut + ' round' + (fut === 1 ? ' is' : 's are') + ' dated in the future. Check those dates in the files.');
    m.msg = 'Checking what is already saved…'; renderImport();
    var keys = Object.keys(m.recs).sort();
    for (i = 0; i < keys.length; i++) {
      var f = keys[i], r = await ghFetchRemote(f);
      if (!r.ok) { m.busy = false; m.msg = 'Could not check ' + f + ': ' + ghExplain(r) + '. Nothing was imported.'; m.months = []; renderImport(); return; }
      var have = new Set(r.list.map(function(x) { return x && x.id; })), add = m.recs[f].filter(function(x) { return !have.has(x.id); }), bytes = (r.size || 0) + JSON.stringify(add).length;
      m.newRecs[f] = add; m.newCount += add.length;
      m.months.push({ file: f, total: m.recs[f].length, add: add.length, have: m.recs[f].length - add.length });
      if (bytes > LIMIT_BYTES) m.warnings.push(f + ' would grow to about ' + Math.round(bytes / 1024) + ' KB, over the 700 KB guide. It will still import; plan to archive that month.');
    }
    m.busy = false; m.ready = m.newCount > 0;
    m.msg = m.newCount ? 'Ready: ' + m.newCount + ' new round' + (m.newCount === 1 ? '' : 's') + ' from ' + valid.length + ' usable round' + (valid.length === 1 ? '' : 's') + ' (' + files.length + ' files selected).' : 'Everything in these files is already here. Nothing to import.';
    renderImport();
  }
  async function runImport() {
    var m = S.imp; if (!m || !m.ready || m.busy || !S.admin) return;
    m.busy = true; m.ready = false; renderImport();
    var keys = Object.keys(m.newRecs).filter(function(k) { return m.newRecs[k].length; }).sort(), done = 0, failed = null;
    for (var i = 0; i < keys.length; i++) {
      var f = keys[i], recs = m.newRecs[f]; m.msg = 'Importing ' + f + ' (' + (i + 1) + ' of ' + keys.length + ')…'; renderImport();
      var res = await ghMutate(f, function(rem) { return planImport(rem, recs); }, 'Import ' + recs.length + ' round' + (recs.length === 1 ? '' : 's') + ' from original app');
      if (!res.ok) { failed = { f: f, res: res }; break; }
      done += recs.length;
    }
    m.busy = false;
    if (failed) { m.ready = true; m.msg = 'Stopped at ' + failed.f + ': ' + ghExplain(failed.res) + '. ' + done + ' round' + (done === 1 ? ' was' : 's were') + ' imported before that. Press Import again to continue; rounds already imported are skipped.'; renderImport(); return; }
    m.msg = '✓ Imported ' + done + ' round' + (done === 1 ? '' : 's') + '.'; m.newCount = 0;
    S.monthsLoaded = Math.max(S.monthsLoaded, monthsNeeded(m.oldest, new Date()));
    toast('✓ Imported ' + done + ' rounds', 4000); renderImport(); load();
  }

  // ── RENDER ────────────────────────────────────────────────────────────────
  function render() {
    CHARTS = {}; chartSeq = 0; if (tip) hideTip();
    renderBanner(); renderAlerts();
    $('btn-admin').textContent = 'Admin mode: ' + (S.admin ? 'on' : 'off'); $('btn-admin').className = 'tbtn' + (S.admin ? ' on' : ''); $('btn-admin').setAttribute('aria-pressed', S.admin ? 'true' : 'false');
    renderOverview(); renderEquipment(); renderHistory();
    var ae = document.activeElement;
    if (!(S.tab === 'set' && ae && $('p-set').contains(ae) && ae.tagName !== 'BUTTON')) renderSettings();   // never wipe a half-typed limit during auto-refresh
    tick();
  }
  function showTab(t) {
    S.tab = t;
    ['over', 'equip', 'hist', 'set'].forEach(function(x) { $('p-' + x).classList.toggle('act', x === t); document.querySelector('.tab[data-t=' + x + ']').classList.toggle('act', x === t); });
  }

  // ── EVENTS ────────────────────────────────────────────────────────────────
  document.querySelectorAll('.tab').forEach(function(b) { b.addEventListener('click', function() { showTab(b.getAttribute('data-t')); window.scrollTo(0, 0); }); });
  $('btn-refresh').addEventListener('click', function() { load(); });
  $('btn-admin').addEventListener('click', function() { S.admin = !S.admin; try { localStorage.setItem(ADMIN_KEY, S.admin ? '1' : '0'); } catch (e) {} render(); toast(S.admin ? 'Admin mode on: delete and limit editing enabled' : 'Admin mode off'); });
  ['f-from', 'f-to', 'f-round', 'f-op', 'f-q', 'f-flags'].forEach(function(id) { $(id).addEventListener('input', function() { S.histShown = 100; renderHistory(); }); $(id).addEventListener('change', function() { S.histShown = 100; renderHistory(); }); });
  $('hmore').addEventListener('click', function() { S.histShown += 100; renderHistory(); });
  $('btn-csv').addEventListener('click', exportCsv);
  $('btn-older').addEventListener('click', function() { S.monthsLoaded++; toast('Loading ' + S.monthsLoaded + ' months…', 1500); load(); });
  $('hbody').addEventListener('click', function(e) {
    var g = function(k) { return e.target.getAttribute && e.target.getAttribute(k); };
    if (g('data-del')) deleteRound(g('data-del')); else if (g('data-edit')) openEdit(g('data-edit'), 'edit'); else if (g('data-note')) openEdit(g('data-note'), 'note');
  });
  $('p-set').addEventListener('change', function(e) {
    var t = e.target, id = t.getAttribute('data-id'), f = t.getAttribute('data-f'); if (!id || !f || !S.admin) return;
    stage(id, f, f === 'on' ? t.checked : t.value);
  });
  $('p-set').addEventListener('change', function(e) { if (e.target.id === 'imp-files') analyzeImport(e.target.files); });
  $('p-set').addEventListener('click', function(e) {
    var t = e.target;
    if (t.id === 'btn-import') runImport();
    else if (t.id === 'btn-save-rules') saveRules();
    else if (t.id === 'btn-discard') { S.pendUp = {}; S.pendRm = {}; renderSettings(); }
    else if (t.getAttribute('data-rm') && S.admin) { S.pendRm[t.getAttribute('data-rm')] = 1; renderSettings(); }
    else if (t.id === 'btn-add' && S.admin) {
      var p = $('add-path').value, mn = $('add-min').value, mx = $('add-max').value; if (!p) return;
      if (mn === '' && mx === '') { toast('Enter a minimum, a maximum, or both'); return; }
      var rule = { id: 'r-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), kind: 'range', label: catLabel(p), path: p, min: mn === '' ? null : parseFloat(mn), max: mx === '' ? null : parseFloat(mx), unit: guessUnit(p), on: true };
      S.pendUp[rule.id] = rule; renderSettings();
    }
  });
  function openTok() { $('tok-state').textContent = GH_TOKEN ? 'A token is saved in this browser (ends in …' + GH_TOKEN.slice(-4) + ').' : 'No token is saved in this browser yet.'; $('tok-in').value = ''; $('tokmodal').hidden = false; $('tok-in').focus(); }
  function closeTok() { $('tokmodal').hidden = true; $('tok-in').value = ''; }
  $('btn-token').addEventListener('click', openTok); $('tok-close').addEventListener('click', closeTok);
  $('tok-save').addEventListener('click', function() {
    var t = $('tok-in').value.trim(); if (t.length < 20) { toast('⚠ That does not look like a token'); return; }
    try { localStorage.setItem(TOKEN_KEY, t); } catch (e) { toast('⚠ Could not store the token in this browser'); return; }
    GH_TOKEN = t; closeTok(); S.lastErr = null; toast('✓ Token saved'); load();
  });
  $('tok-clear').addEventListener('click', function() { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} GH_TOKEN = ''; closeTok(); render(); });
  document.addEventListener('visibilitychange', function() { if (document.visibilityState === 'visible' && S.lastOk && Date.now() - S.lastOk > REFRESH_MS) load(); });

  // ── START ─────────────────────────────────────────────────────────────────
  $('ver').textContent = DASH_VERSION;
  initTip();
  showTab('over'); render();
  setInterval(tick, 1000);
  if (GH_TOKEN) load();
})();
</script>
</body>
</html>
