<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>OSLU Plant Rounds Dashboard</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#eef1f0;--card:#ffffff;--text:#1A2E2C;--text2:#3d4b49;--text3:#566462;
  --border:#d8dedc;--input-bg:#ffffff;--input-border:#7d8b89;
  --warm:#B5500A;--warm-l:#FDEBD0;--warm-alt:#FEF6EE;--warm-g:#F0C0A0;--warm-t:#6B2E00;
  --cool:#1565A0;--cool-l:#D6EAF8;--cool-alt:#EEF6FD;--cool-g:#90C0E0;--cool-t:#0D3F6B;
  --teal:#1A7A6E;--teal-l:#E0F4F1;--teal-alt:#F0FAF8;--teal-g:#A8D5CC;--teal-t:#0F5A50;
  --ok:#1A7A3C;--off:#444444;--danger:#C0392B;--danger-text:#A32A1E;--danger-bg:#FBE4E1;
  --on-solid:#ffffff;
  --grad:linear-gradient(90deg,#0A6C96 0%,#12796D 50%,#3C7D22 100%);
  --card-shadow:0 1px 4px rgba(0,0,0,.10);--btn-shadow:0 1px 2px rgba(0,0,0,.20);--bar-shadow:0 -2px 10px rgba(0,0,0,.10);
  --toast-bg:#1A2E2C;--toast-text:#ffffff;--scrim:rgba(0,0,0,.55);
  --r:8px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1514;--card:#172220;--text:#e8f0ee;--text2:#bccac7;--text3:#9bacaa;
    --border:#2c3b38;--input-bg:#0f1918;--input-border:#6f817e;
    --warm:#B5500A;--warm-l:#3a2412;--warm-alt:#1f1b17;--warm-g:#6b4220;--warm-t:#f6cfaa;
    --cool:#1565A0;--cool-l:#15314b;--cool-alt:#18232c;--cool-g:#2d5a7e;--cool-t:#aad3f3;
    --teal:#1A7A6E;--teal-l:#123733;--teal-alt:#162a28;--teal-g:#2c6a62;--teal-t:#a3ded4;
    --danger-text:#ffa196;--danger-bg:#4a1f1a;
    --card-shadow:0 1px 5px rgba(0,0,0,.55);--btn-shadow:0 1px 3px rgba(0,0,0,.65);--bar-shadow:0 -2px 12px rgba(0,0,0,.6);
    --toast-bg:#e8f0ee;--toast-text:#0e1514;
  }
}
/* ---- dashboard-only tokens (the shared palette above is copied verbatim from the field app) ---- */
:root{--ok-bg:#DDF3E4;--ok-text:#14532D;--chart-grid:#c9d1cf;--band:#cfe8e3;}
@media (prefers-color-scheme:dark){:root{--ok-bg:#12331f;--ok-text:#a8e6bd;--chart-grid:#33423f;--band:#1d4a43;}}
*{box-sizing:border-box;margin:0;padding:0;}
[hidden]{display:none !important;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','SF Pro Text',Roboto,sans-serif;font-size:14px;line-height:1.4;background:var(--bg);color:var(--text);min-height:100vh;}
button,input,select{font-family:inherit;}
.top{background:var(--grad);color:var(--on-solid);padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;}
.top h1{font-size:20px;font-weight:700;}
.top p{font-size:13px;}
.ver{font-weight:700;white-space:nowrap;}
.topr{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;font-weight:600;}
.tbtn{min-height:44px;padding:0 14px;border-radius:var(--r);border:1.5px solid var(--input-border);background:var(--card);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;box-shadow:var(--btn-shadow);}
.tbtn:active{box-shadow:none;transform:translateY(1px);}
.tbtn.on{background:var(--danger);border-color:var(--danger);color:var(--on-solid);}
.banner{padding:12px 20px;font-size:14px;font-weight:700;background:var(--warm-l);color:var(--warm-t);border-bottom:2px solid var(--warm);}
.banner.err{background:var(--danger);color:var(--on-solid);border-color:var(--danger);}
.alerts{background:var(--danger);color:var(--on-solid);padding:12px 20px;}
.alerts h2{font-size:15px;margin-bottom:6px;}
.alerts ul{list-style:none;display:flex;flex-direction:column;gap:3px;font-size:14px;font-weight:600;}
.tabs{display:flex;background:var(--card);border-bottom:2px solid var(--border);position:sticky;top:0;z-index:20;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;min-height:48px;padding:0 22px;font-size:14px;font-weight:700;border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;color:var(--text3);}
.tab.act{color:var(--teal-t);border-bottom-color:var(--teal);background:var(--teal-l);}
.wrap{max-width:1560px;margin:0 auto;padding:16px 20px 60px;}
.pane{display:none;}
.pane.act{display:block;}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--card-shadow);margin-bottom:16px;overflow:hidden;}
.card>h2{padding:12px 16px;font-size:15px;font-weight:700;color:var(--on-solid);}
.card>h2.c{background:var(--cool);}.card>h2.w{background:var(--warm);}.card>h2.t{background:var(--teal);}
.card>h2 small{font-weight:600;margin-left:8px;font-size:13px;}
.pad{padding:14px 16px;}
.note{font-size:13px;color:var(--text2);line-height:1.5;}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:16px;}
.tile{background:var(--card);border-radius:var(--r);box-shadow:var(--card-shadow);padding:14px 16px;border-left:6px solid var(--teal);}
.tile.ok{border-left-color:var(--ok);}.tile.warn{border-left-color:var(--warm);}.tile.late,.tile.bad{border-left-color:var(--danger);}
.tile .k{font-size:13px;color:var(--text2);font-weight:600;}
.tile .v{font-size:30px;font-weight:700;line-height:1.15;margin:2px 0;}
.tile .s{font-size:13px;color:var(--text2);}
.chip{display:inline-block;padding:2px 10px;border-radius:12px;font-size:13px;font-weight:700;white-space:nowrap;}
.chip.ok{background:var(--ok-bg);color:var(--ok-text);}
.chip.warn{background:var(--warm-l);color:var(--warm-t);}
.chip.late,.chip.bad{background:var(--danger);color:var(--on-solid);}
.chip.none{background:var(--card);color:var(--text2);border:1px dashed var(--input-border);}
.chip.info{background:var(--cool-l);color:var(--cool-t);}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr);}}
.hxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;padding:14px 16px;}
.hxcard{border:1px solid var(--border);border-radius:var(--r);padding:12px;background:var(--card);}
.hxcard.bad{border:2px solid var(--danger);}
.hxcard h3{font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.hxcard h3 small{font-size:13px;color:var(--text2);font-weight:600;}
.hxnums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0;}
.hxnums div{font-size:13px;color:var(--text2);}
.hxnums b{display:block;font-size:20px;color:var(--text);line-height:1.2;}
.chart{display:block;width:100%;height:auto;}
.ax{font-size:12px;fill:var(--text3);}
.l-act{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;}
.l-cool{stroke:var(--cool);}.l-heat{stroke:var(--warm);}
.l-sp{fill:none;stroke:var(--text2);stroke-width:1.8;stroke-dasharray:5 4;}
.dot-cool{fill:var(--cool);}.dot-heat{fill:var(--warm);}
.band{fill:var(--band);}
.grid-l{stroke:var(--chart-grid);stroke-width:1;}
.lgnd{display:flex;gap:14px;font-size:12px;color:var(--text2);margin-top:2px;flex-wrap:wrap;}
.lgnd i{display:inline-block;width:18px;height:0;border-top:3px solid var(--cool);vertical-align:middle;margin-right:5px;}
.lgnd i.h{border-top-color:var(--warm);}.lgnd i.d{border-top:2px dashed var(--text2);}
.donutwrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:14px 16px;}
.donut{width:150px;height:150px;flex:0 0 auto;}
.donut .num{font-size:28px;font-weight:700;fill:var(--text);}
.donut .lab{font-size:12px;fill:var(--text3);}
.s-R{stroke:var(--ok);}.s-O{stroke:var(--off);}.s-F{stroke:var(--danger);}.s-N{stroke:var(--chart-grid);}
.legend{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px;}
.legend b{font-size:18px;margin-right:6px;}
.legend .sw{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:8px;vertical-align:-2px;}
.sw.R{background:var(--ok);}.sw.O{background:var(--off);}.sw.F{background:var(--danger);}.sw.N{background:var(--chart-grid);}
.lc{padding:12px 16px;}
.lc h3{font-size:13px;color:var(--text2);margin:10px 0 6px;font-weight:700;}
.lc h3:first-child{margin-top:0;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.scrollx{overflow-x:auto;}
table{border-collapse:collapse;width:100%;font-size:14px;}
th{font-size:13px;text-align:left;color:var(--text2);font-weight:700;padding:6px 8px;border-bottom:2px solid var(--border);white-space:nowrap;}
td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
tbody tr:nth-child(even) td{background:var(--teal-alt);}
.hm th,.hm td{text-align:center;}
.hm th:first-child,.hm td:first-child{text-align:left;font-weight:700;white-space:nowrap;}
.hm td{min-width:64px;font-variant-numeric:tabular-nums;}
.hm .flag{background:var(--danger) !important;color:var(--on-solid);font-weight:700;}
.hm .unusual{background:var(--warm-l) !important;color:var(--warm-t);font-weight:700;}
.hm .na{color:var(--text3);}
.hm .sR{background:var(--ok-bg) !important;color:var(--ok-text);font-weight:700;}
.hm .sO{color:var(--text2);font-weight:700;}
.hm h3{font-size:14px;}
.sechead{font-size:16px;font-weight:700;margin:18px 0 8px;display:flex;gap:10px;align-items:baseline;}
.sechead small{font-size:13px;color:var(--text2);font-weight:600;}
.ucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
.ucard{position:relative;background:var(--card);border-radius:var(--r);box-shadow:var(--card-shadow);padding:12px;overflow:hidden;}
.ucard h3{min-height:28px;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center;}
.ucard.fault{border:2px solid var(--danger);}
.ucard .oos{margin:-12px -12px 8px;padding:6px 12px;background:var(--danger);color:var(--on-solid);font-weight:700;font-size:13px;}
.ucard dl{display:grid;grid-template-columns:auto auto;gap:2px 10px;font-size:13px;margin:8px 0;}
.ucard dt{color:var(--text2);}.ucard dd{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;}
.spark{display:block;width:100%;height:44px;}
.cap{font-size:12px;color:var(--text3);}
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;padding:12px 16px;border-bottom:1px solid var(--border);}
.filters label{font-size:13px;font-weight:700;color:var(--text2);display:flex;flex-direction:column;gap:3px;}
.filters input,.filters select,.fld{border:1.5px solid var(--input-border);border-radius:6px;padding:8px 10px;font-size:14px;min-height:44px;background:var(--input-bg);color:var(--text);}
.filters .chk{flex-direction:row;align-items:center;gap:8px;min-height:44px;}
.filters .chk input{width:20px;height:20px;min-height:0;}
.btn{min-height:44px;padding:0 16px;border-radius:var(--r);border:none;font-size:14px;font-weight:700;cursor:pointer;background:var(--teal-l);color:var(--teal-t);box-shadow:var(--btn-shadow);}
.btn:active{box-shadow:none;transform:translateY(1px);}
.btn.pri{background:var(--grad);color:var(--on-solid);}
.btn.del{background:var(--danger);color:var(--on-solid);min-height:36px;padding:0 12px;}
.btn[disabled]{filter:grayscale(.6);cursor:default;}
.notes{max-width:420px;white-space:pre-wrap;word-break:break-word;}
details.dd summary{cursor:pointer;color:var(--teal-t);font-weight:700;}
.flagl{color:var(--danger-text);font-weight:700;}
.set input.fld{width:90px;text-align:center;}
.set td:first-child{min-width:230px;font-weight:600;}
code{font-size:12px;color:var(--text2);word-break:break-all;}
.empty{padding:26px 16px;font-size:15px;color:var(--text2);line-height:1.5;}
.modal{position:fixed;inset:0;background:var(--scrim);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px;}
.mbox{background:var(--card);color:var(--text);border-radius:12px;padding:20px;width:100%;max-width:440px;box-shadow:var(--card-shadow);}
.mbox h2{font-size:17px;margin-bottom:8px;}
.mbox p{font-size:13px;line-height:1.5;color:var(--text2);margin-bottom:10px;}
.mbox label{font-size:13px;font-weight:700;display:block;margin-bottom:4px;}
.mbox input{width:100%;border:1.5px solid var(--input-border);border-radius:6px;padding:10px;font-size:16px;min-height:44px;background:var(--input-bg);color:var(--text);margin-bottom:12px;}
.mrow{display:flex;gap:8px;flex-wrap:wrap;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-text);padding:12px 20px;border-radius:24px;font-size:14px;font-weight:600;z-index:500;opacity:0;transition:opacity .3s;pointer-events:none;width:max-content;max-width:90vw;text-align:center;}
.toast.on{opacity:1;}
:focus-visible{outline:2px solid var(--teal-t);outline-offset:2px;}
@media (max-width:600px){.wrap{padding:12px 10px 50px;}.top{padding:12px;}.hxgrid{padding:10px;grid-template-columns:minmax(0,1fr);}.tile .v{font-size:26px;}}
</style>

<body>
<header class="top">
  <div><h1>ONNI South Lake Union · District Energy</h1><p>Plant rounds dashboard · Capilano Energy · <span class="ver" id="ver"></span></p></div>

<nav class="tabs" aria-label="Sections">

</nav>
<main class="wrap">
  <section class="pane act" id="p-over"></section>
  <section class="pane" id="p-equip"></section>

    <div class="card">

    <h2 id="tok-h">Data token</h2>

    <div class="mrow"><button class="btn pri" id="tok-save">Save token</button><button class="btn" id="tok-clear">Remove token</button><button class="btn" id="tok-close">Close</button></div>
  </div>
</div>

<script>
// ===== CONFIG =====
var GH_REPO='Lscapo/District-Energy-Plant-Data', GH_BRANCH='data';
var GH_TOKEN=''; try{GH_TOKEN=localStorage.getItem('oslu-token')||'';}catch(e){}
// ===== GH CORE BEGIN (shared by field app + dashboard) =====
// The page defines GH_REPO ('owner/repo'), GH_BRANCH ('data') and GH_TOKEN (string, may be empty).
// Every write follows one rule: fetch the CURRENT remote file, apply a small ID-based change
// to that fresh copy, PUT with the SHA from that same fetch. Local copies are never a write base.
function ghUrl(file){return 'https://api.github.com/repos/'+GH_REPO+'/contents/'+file+'?ref='+GH_BRANCH;}
function ghPutUrl(file){return 'https://api.github.com/repos/'+GH_REPO+'/contents/'+file;}
function monthFile(dateIso){var m=/^(\d{4})-(\d{2})-\d{2}$/.exec(String(dateIso||''));return m?'data-'+m[1]+'-'+m[2]+'.json':null;}
function b64ToUtf8(b){
  var bin=atob(String(b).replace(/\s/g,''));
  var bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function utf8ToB64(s){return btoa(unescape(encodeURIComponent(s)));}
function stripLocal(e){var c={};for(var k in e){if(k!=='synced')c[k]=e[k];}return c;}

// One timer covers the whole request INCLUDING reading the body (a stalled body hangs forever otherwise)
async function ghRequest(url,opts,ms){
  var c=new AbortController();
  var t=setTimeout(function(){c.abort();},ms);
  try{
    var r=await fetch(url,Object.assign({cache:'no-store',signal:c.signal},opts));
    var text=await r.text();
    return{status:r.status,ok:r.ok,text:text};
  }finally{clearTimeout(t);}
}
function ghHdr(accept,json){
  var h={'Authorization':'token '+GH_TOKEN,'Accept':accept||'application/vnd.github.v3+json'};
  if(json)h['Content-Type']='application/json';
  return h;
}

async function ghFetchRemote(file){
  if(!GH_TOKEN)return{ok:false,reason:'notoken'};
  try{
    var r=await ghRequest(ghUrl(file),{headers:ghHdr()},5000);
    if(r.status===404)return{ok:true,list:[],sha:null,missing:true};
    if(r.status===401)return{ok:false,reason:'auth',status:401};
    if(!r.ok)return{ok:false,reason:'http',status:r.status};
    var j=JSON.parse(r.text);
    var text;
    if(j.content&&j.encoding!=='none'){
      text=b64ToUtf8(j.content);
    }else if(j.size>0){
      // Contents API returns EMPTY content for files over 1 MB -- fetch the raw body instead
      var rr=await ghRequest(ghUrl(file),{headers:ghHdr('application/vnd.github.raw+json')},12000);
      if(!rr.ok)return{ok:false,reason:'http',status:rr.status};
      text=rr.text;
    }else{text='[]';}
    var list=JSON.parse(text);
    if(!Array.isArray(list))return{ok:false,reason:'format'};
    if(j.size>10&&list.length===0)return{ok:false,reason:'format'}; // never trust an "empty" read of a non-empty file
    return{ok:true,list:list,sha:j.sha,size:j.size};
  }catch(e){return{ok:false,reason:'network',error:String(e)};}
}

async function ghPut(file,list,sha,message){
  try{
    var body={message:message,content:utf8ToB64(JSON.stringify(list.map(stripLocal))),branch:GH_BRANCH};
    if(sha)body.sha=sha;
    var w=await ghRequest(ghPutUrl(file),{method:'PUT',headers:ghHdr(null,true),body:JSON.stringify(body)},20000);
    if(w.ok)return{ok:true};
    return{ok:false,status:w.status};
  }catch(e){return{ok:false,error:String(e)};} // outcome unknown -- the next attempt re-checks by ID
}

// mutator(remoteList) -> null (nothing to change) or {list, added, removed}
async function ghMutate(file,mutator,message){
  if(!GH_TOKEN)return{ok:false,reason:'notoken'};
  for(var attempt=0;attempt<3;attempt++){
    var rem=await ghFetchRemote(file);
    if(!rem.ok)return{ok:false,reason:rem.reason,status:rem.status};
    var plan=mutator(rem.list);
    if(!plan)return{ok:true,changed:false,list:rem.list};
    // Safety guard: the write may only add/remove exactly what the mutator says it does
    var keep=new Set(plan.list),lost=0;
    for(var i=0;i<rem.list.length;i++){if(!keep.has(rem.list[i]))lost++;}
    var added=plan.list.length-(rem.list.length-lost);
    if(lost!==(plan.removed||0)||added!==(plan.added||0))return{ok:false,reason:'guard'};
    var w=await ghPut(file,plan.list,rem.sha,message);
    if(w.ok)return{ok:true,changed:true,list:plan.list};
    if(w.status===409||w.status===422)continue; // someone wrote first: re-fetch, re-apply, retry
    if(w.status===401)return{ok:false,reason:'auth',status:401};
    return{ok:false,reason:w.status?'http':'network',status:w.status};
  }
  return{ok:false,reason:'conflict'};
}

// Delete exactly one record by ID from the FRESH remote copy. If the ID is absent nothing is written;
// if it matches more than one record (should never happen) the guard aborts the write.
async function ghDeleteById(file,id){
  return ghMutate(file,function(remote){
    var out=remote.filter(function(r){return!(r&&r.id===id);});
    var gone=remote.length-out.length;
    if(gone===0)return null;
    return{list:out,added:0,removed:1}; // guard compares this claim (1) with what really disappears
  },'Delete round '+id);
}

// Plain-language text for every failure reason (never a generic "offline")
function ghExplain(r){
  if(!r||r.ok)return '';
  if(r.reason==='notoken')return 'No token set';
  if(r.reason==='auth')return 'Token rejected (401). Tap Token to change it';
  if(r.reason==='http'){
    if(r.status===403)return 'Token lacks permission, or GitHub rate limit reached (403)';
    if(r.status===404)return 'Data repo or branch not found, or token has no access to it (404)';
    return 'GitHub returned an error ('+r.status+')';
  }
  if(r.reason==='format')return 'Data file has a format problem. Nothing was written';
  if(r.reason==='guard')return 'Safety check blocked the write. Nothing was written';
  if(r.reason==='conflict')return 'Another device was writing. Will retry';
  if(r.reason==='network')return 'No signal, or the request timed out';
  return 'Sync problem ('+r.reason+')';
}

function esc(s){return String(s===null||s===undefined?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function dv(x){return(x===null||x===undefined||x==='')?'—':String(x);}   // 0 is a real value, never "empty"
function dvs(x){return esc(dv(x));}
function clone(o){return JSON.parse(JSON.stringify(o));}

// FLAG RULES. These are only the starting values; the dashboard's Settings tab edits them and saves them to
// limits.json on the data branch, and both apps then use that file. Nothing here is a compliance claim.
//  range rule: {id,kind:'range',label,path,min,max,unit,on}      min and/or max may be null (one-sided)
//  delta rule: {id,kind:'delta',label,path,sp,below,above,unit,on}  flags when (reading - setpoint) is more than
//              'below' under or 'above' over the setpoint. Blank (null) = not flagged yet; the difference is still shown.
// 'path' matches the saved record; [*] matches any unit/pump/zone name. Units that are Off (status O) are skipped for delta rules.
function R(id,label,path,min,max){return{id:id,kind:'range',label:label,path:path,min:min,max:max,unit:'%',on:true};}
function D(id,label,path,sp){return{id:id,kind:'delta',label:label,path:path,sp:sp,below:null,above:null,unit:'°F',on:true};}
var DEFAULT_RULES=[
  {id:'r-ct-ph',kind:'range',label:'Cooling tower pH',path:'cooling_tower.ph',min:7.0,max:8.5,unit:'',on:true},
  R('r-ch-pct','Chiller % full power','chiller_plant.chillers[*].pct_full_power',0,100),
  R('r-chx-valve','Cooling HX valve %','cooling_hx.zones[*].valve_pct',0,100),
  R('r-hhx-valve','Heating HX valve %','heating_hx.zones[*].valve_pct',0,100),
  R('r-b-fire','Boiler fire rate %','boiler_plant.boilers[*].fire_rate',0,100),
  R('r-hrc-status','HRC status %','hrc.status',0,100),
  R('r-hrc-demand','HRC demand %','hrc.demand',0,100),
  D('d-hx2','HX-2 delivery vs setpoint','heating_hx.zones[HX-2].supply_temp','heating_hx.hx_setpoint'),
  D('d-hx3','HX-3 delivery vs setpoint','heating_hx.zones[HX-3].supply_temp','heating_hx.hx_setpoint'),
  D('d-hx4','HX-4 delivery vs setpoint','heating_hx.zones[HX-4].supply_temp','heating_hx.hx_setpoint'),
  D('d-hx5','HX-5 delivery vs setpoint','heating_hx.zones[HX-5].supply_temp','heating_hx.hx_setpoint'),
  D('d-hx7','HX-7 delivery vs setpoint','cooling_hx.zones[HX-7].supply_temp','cooling_hx.hx_setpoint'),
  D('d-hx8','HX-8 delivery vs setpoint','cooling_hx.zones[HX-8].supply_temp','cooling_hx.hx_setpoint'),
  D('d-hx9','HX-9 delivery vs setpoint','cooling_hx.zones[HX-9].supply_temp','cooling_hx.hx_setpoint'),
  D('d-ch','Chiller supply vs setpoint','chiller_plant.chillers[*].supply_temp','chiller_plant.cooling_setpoint'),
  D('d-boiler','Boiler temp vs setpoint','boiler_plant.boilers[*].temp','boiler_plant.heating_setpoint'),
  D('d-ct','Tower return vs setpoint','cooling_tower.tower_return_temp','cooling_tower.ct_setpoint'),
  D('d-dhw','DHW tank vs setpoint','dhw_tank.tank_temperature','dhw_tank.tank_setpoint')
];
var RULES=clone(DEFAULT_RULES);
function validRule(r){return!!(r&&typeof r.id==='string'&&(r.kind==='range'||r.kind==='delta')&&typeof r.path==='string'&&(r.kind==='range'||typeof r.sp==='string'));}
// an empty or unreadable list means "use the starting values"
function setRules(list){var ok=Array.isArray(list)?list.filter(validRule):[];RULES=ok.length?clone(ok):clone(DEFAULT_RULES);return RULES;}

// 'low' / 'high' / null. Boundaries are inclusive (the limit itself is fine); 0 is a real reading.
function checkRange(rule,v){
  if(typeof v!=='number'||isNaN(v))return null;
  if(typeof rule.min==='number'&&v<rule.min)return'low';
  if(typeof rule.max==='number'&&v>rule.max)return'high';
  return null;
}
function checkDelta(rule,actual,sp){
  if(typeof actual!=='number'||typeof sp!=='number'||isNaN(actual)||isNaN(sp))return null;
  var d=Math.round((actual-sp)*1000)/1000;
  if(typeof rule.below==='number'&&d<-rule.below)return'below';
  if(typeof rule.above==='number'&&d>rule.above)return'above';
  return null;
}
function boundsText(r){
  var hasMin=typeof r.min==='number',hasMax=typeof r.max==='number',u=r.unit?' '+r.unit:'';
  if(hasMin&&hasMax)return r.min+'–'+r.max+u;
  if(hasMax)return'up to '+r.max+u;
  if(hasMin)return'at least '+r.min+u;
  return'no limit set';
}
function ruleRegex(path){
  var parts=path.split('[*]').map(function(p){return p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');});
  return new RegExp('^'+parts.join('\\[[^\\]]*\\]')+'$');
}
function flattenRec(o,prefix,out){
  out=out||[];prefix=prefix||'';
  if(Array.isArray(o)){
    o.forEach(function(it,i){var nm=(it&&(it.unit||it.pump||it.zone))||String(i);flattenRec(it,prefix+'['+nm+']',out);});
    return out;
  }
  if(o&&typeof o==='object'){for(var k in o){flattenRec(o[k],prefix?(prefix+'.'+k):k,out);}return out;}
  out.push({path:prefix,value:o});
  return out;
}
function humanPath(path){
  var m=/\[([^\]]*)\][^\[]*$/.exec(path);
  var key=path.split('.').pop().replace(/_/g,' ');
  if(m)return m[1]+' '+key;
  var seg=path.split('.');
  return seg.length>1?(seg[0].replace(/_/g,' ')+' '+key):key;
}
// Structured flags for one record: [{type:'fault'|'range'|'delta', path, text}]
function flagList(rec,rules){
  rules=rules||RULES;
  var flat=flattenRec(rec,'',[]),map={},out=[];
  flat.forEach(function(f){map[f.path]=f.value;});
  flat.forEach(function(f){if(/\.status$/.test(f.path)&&f.value==='F')out.push({type:'fault',path:f.path,text:humanPath(f.path)+': Fault'});});
  rules.forEach(function(rule){
    if(rule.on===false)return;
    var re=ruleRegex(rule.path);
    flat.forEach(function(f){
      if(!re.test(f.path))return;
      var u=rule.unit?(' '+rule.unit):'';
      if(rule.kind==='range'){
        var s=checkRange(rule,f.value);
        if(s)out.push({type:'range',path:f.path,text:humanPath(f.path)+' '+f.value+u+' ('+(s==='low'?'below':'above')+' limit '+boundsText(rule)+')'});
      }else{
        var statusPath=f.path.slice(0,f.path.lastIndexOf('.'))+'.status';
        if(map[statusPath]==='O')return;                     // a unit that is Off is not delivering
        var sp=map[rule.sp],t=checkDelta(rule,f.value,sp);
        if(t){var diff=Math.abs(Math.round((f.value-sp)*10)/10);
          out.push({type:'delta',path:f.path,text:humanPath(f.path)+' '+f.value+u+' is '+diff+u+' '+t+' setpoint '+sp+' (allowed '+(t==='below'?rule.below:rule.above)+u+' '+t+')'});}
      }
    });
  });
  return out;
}
function recordFlags(rec){return flagList(rec).map(function(f){return f.text;});}
// ===== RULES END =====
// ===== DASH LOGIC BEGIN (pure, no DOM; tested in Node) =====
var DASH_VERSION='v1 - 2026-10-15';
var NAME_KEYS=['unit','pump','zone'];
function itemName(it){return(it&&(it.unit||it.pump||it.zone))||'';}
// getPath(rec,'boiler_plant.boilers[B-1].psi') -> value (undefined if absent)
function getPath(o,path){
  var segs=String(path).split('.');
  for(var i=0;i<segs.length;i++){
    if(o===null||o===undefined)return undefined;
    var m=/^([^\[]+)(?:\[(.*)\])?$/.exec(segs[i]);if(!m)return undefined;
    o=o[m[1]];
    if(m[2]!==undefined){if(!Array.isArray(o))return undefined;var nm=m[2];o=o.find(function(it){return itemName(it)===nm;});}
  }
  return o;
}
// Equipment sections. st = has an R/O/F status. sp = setpoint path, spField = the reading judged against it.
var SECTIONS=[
  {id:'chillers',title:'Chillers',path:'chiller_plant.chillers',group:'cool',st:true,sp:'chiller_plant.cooling_setpoint',spField:'supply_temp'},
  {id:'cwp',title:'Condenser water pumps',path:'condenser_water_pumps',group:'cool',st:true},
  {id:'chx',title:'Cooling heat exchangers',path:'cooling_hx.zones',group:'cool',hx:true,sp:'cooling_hx.hx_setpoint',spField:'supply_temp'},
  {id:'cloop',title:'Cool loop pressure',path:'cool_loop',group:'cool',single:true},
  {id:'ccp',title:'Cool loop circulation pumps',path:'cool_loop.circ_pumps',group:'cool',st:true},
  {id:'tower',title:'Cooling tower',path:'cooling_tower',group:'cool',single:true,sp:'cooling_tower.ct_setpoint',spField:'tower_return_temp'},
  {id:'boilers',title:'Boilers',path:'boiler_plant.boilers',group:'heat',st:true,sp:'boiler_plant.heating_setpoint',spField:'temp'},
  {id:'fwp',title:'Feedwater pumps',path:'feedwater_pumps',group:'heat',st:true},
  {id:'hhx',title:'Heating heat exchangers',path:'heating_hx.zones',group:'heat',hx:true,sp:'heating_hx.hx_setpoint',spField:'supply_temp'},
  {id:'hloop',title:'Heat loop pressure',path:'heat_loop',group:'heat',single:true},
  {id:'hcp',title:'Heat loop circulation pumps',path:'heat_loop.circ_pumps',group:'heat',st:true},
  {id:'dhw',title:'Domestic hot water tank',path:'dhw_tank',group:'heat',single:true,sp:'dhw_tank.tank_setpoint',spField:'tank_temperature'},
  {id:'bp',title:'DHW booster pumps',path:'dhw_tank.booster_pumps',group:'heat',st:true},
  {id:'hrc',title:'Heat recovery chiller',path:'hrc',group:'shared',single:true},
  {id:'hrcp',title:'HRC pumps',path:'hrc_pumps',group:'shared',st:true}
];
var HX_NOTES={'HX-7':'<20','HX-8':'T1 >20','HX-9':'T2 >20','HX-2':'DHW','HX-3':'<20','HX-4':'T1 >20','HX-5':'T2 >20'};
var KEY_LABELS={supply_temp:'Supply °F',valve_pct:'Valve %',running_pump:'Pump',psi:'PSI',hz:'Hz',amps:'Amps',status:'Status',temp:'Temp °F',fire_rate:'Fire %',pct_full_power:'Power %',
  cool_loop_psi:'Loop PSI',heat_loop_psi:'Loop PSI',lead_tower:'Lead tower',ct_setpoint:'Setpoint °F',tower_return_temp:'Return °F',chem_feeder_status:'Chem feeder',ph:'pH',orp_mv:'ORP mV',
  temperature:'Temp °F',conductivity:'Cond. µS/cm',basket_strainer_1_psi:'Strainer 1 PSI',basket_strainer_2_psi:'Strainer 2 PSI',tank_setpoint:'Setpoint °F',system_pressure:'System PSI',
  suction_pressure:'Suction PSI',tank_temperature:'Tank °F',demand:'Demand %',mode:'Mode',entering_chilled_water:'Ent. CW °F',leaving_chilled_water:'Lvg. CW °F',entering_heating_water:'Ent. HW °F',leaving_heating_water:'Lvg. HW °F'};
// primary reading shown as the trend line on an equipment card
var TREND_KEYS=['supply_temp','temp','tank_temperature','tower_return_temp','psi','pct_full_power','cool_loop_psi','heat_loop_psi','status','hz','amps'];
function keyLabel(k){return KEY_LABELS[k]||k.replace(/_/g,' ');}

function recWhen(r){
  var m=(r&&r.meta)||{},d=/^(\d{4})-(\d{2})-(\d{2})$/.exec(m.date||'');if(!d)return null;
  var t=/^(\d{1,2}):(\d{2})/.exec(m.time||'')||[0,'0','0'];
  return new Date(+d[1],+d[2]-1,+d[3],+t[1],+t[2]);
}
function sortRecords(list){
  return list.slice().sort(function(a,b){
    var ta=recWhen(a),tb=recWhen(b),x=(tb?tb.getTime():0)-(ta?ta.getTime():0);
    return x||String(b.recorded_at).localeCompare(String(a.recorded_at));
  });
}
function ageText(ms){
  var m=Math.round(ms/60000);
  if(m<1)return'just now';if(m<90)return m+' min ago';
  var h=Math.round(m/60);if(h<48)return h+' h ago';
  return Math.round(h/24)+' days ago';
}
function ageLevel(ms){var h=ms/3600000;return h<=24?'ok':(h<=48?'warn':'late');}   // green within 24 h, amber within 48 h, red beyond
function fmtNum(v,dp){if(typeof v!=='number'||isNaN(v))return'—';var p=Math.pow(10,dp===undefined?1:dp);var r=Math.round(v*p)/p;return String(r);}

function sectionItems(rec,sec){
  var o=getPath(rec,sec.path);
  if(o===null||o===undefined)return[];
  if(Array.isArray(o))return o.map(function(it){return{name:itemName(it),obj:it};});
  return sec.single?[{name:sec.title,obj:o}]:[];
}
function primFields(obj){var out=[];for(var k in obj){if(NAME_KEYS.indexOf(k)>=0)continue;var v=obj[k];if(v!==null&&typeof v==='object')continue;out.push(k);}return out;}
function hasData(obj){var f=primFields(obj);for(var i=0;i<f.length;i++){var v=obj[f[i]];if(v!==null&&v!==undefined&&v!=='')return true;}return false;}
function findItem(rec,sec,name){var it=sectionItems(rec,sec);for(var i=0;i<it.length;i++)if(it[i].name===name)return it[i].obj;return null;}
function unitList(records){
  var seen={},out=[];
  SECTIONS.forEach(function(sec){records.forEach(function(r){sectionItems(r,sec).forEach(function(it){var k=sec.id+'|'+it.name;if(!seen[k]){seen[k]=1;out.push({sec:sec,name:it.name});}});});});
  return out;
}
// per unit: when it was last actually recorded (records are newest first)
function lastChecked(records,now){
  return unitList(records).map(function(u){
    for(var i=0;i<records.length;i++){
      var it=findItem(records[i],u.sec,u.name);
      if(it&&hasData(it)){var w=recWhen(records[i]);if(w){var ms=now.getTime()-w.getTime();return{sec:u.sec,name:u.name,when:w,ms:ms,level:ageLevel(ms)};}}
    }
    return{sec:u.sec,name:u.name,when:null,ms:null,level:'none'};
  });
}
function statusCounts(rec){
  var c={R:0,O:0,F:0,none:0,faults:[]};
  SECTIONS.forEach(function(sec){
    if(!sec.st)return;
    sectionItems(rec,sec).forEach(function(it){
      var s=it.obj.status;
      if(s==='R'||s==='O'||s==='F'){c[s]++;if(s==='F')c.faults.push(it.name);}else c.none++;
    });
  });
  return c;
}
function num(v){return typeof v==='number'&&!isNaN(v)?v:null;}
// one row per heat exchanger zone: delivery (supply) vs the section setpoint, same round
function hxRows(rec,sec){
  var sp=num(getPath(rec,sec.sp));
  return sectionItems(rec,sec).map(function(it){
    var s=num(it.obj.supply_temp);
    return{name:it.name,supply:s,setpoint:sp,delta:(s!==null&&sp!==null)?Math.round((s-sp)*10)/10:null,valve:num(it.obj.valve_pct),pump:it.obj.running_pump||null,psi:num(it.obj.psi)};
  });
}
// values oldest -> newest for the last n rounds (records newest first)
function seriesOf(records,n,fn){
  var out=[];for(var i=Math.min(n,records.length)-1;i>=0;i--){var v;try{v=fn(records[i]);}catch(e){v=null;}out.push(num(v));}
  return out;
}
function unitGetter(sec,name,key){return function(rec){var it=findItem(rec,sec,name);if(!it)return null;var v=it[key];return key==='status'?({R:2,O:1,F:0})[v]:v;};}
// informational only: current reading is far from the previous rounds' typical value
function isUnusual(cur,prior){
  var p=prior.filter(function(v){return typeof v==='number';});
  if(typeof cur!=='number'||p.length<5)return false;
  var mean=p.reduce(function(a,b){return a+b;},0)/p.length;
  var sd=Math.sqrt(p.reduce(function(a,b){return a+(b-mean)*(b-mean);},0)/p.length);
  sd=Math.max(sd,Math.abs(mean)*0.01,0.01);
  return Math.abs(cur-mean)>3*sd;
}

// ---- CSV: every saved value as a column, text cells neutralised against spreadsheet formulas ----
function csvCell(v){
  if(v===null||v===undefined)return'';
  var s=String(v);
  if(typeof v==='string'&&/^[=+\-@\t\r]/.test(s))s="'"+s;
  if(/[",\n\r]/.test(s))s='"'+s.replace(/"/g,'""')+'"';
  return s;
}
function recordsToCsv(records,rules){
  var lead=['id','recorded_at','app_version','schema'],cols=[],seen={};
  var rows=records.map(function(r){
    var flat=flattenRec(r,'',[]),m={};
    flat.forEach(function(f){m[f.path]=f.value;if(lead.indexOf(f.path)<0&&f.path!=='notes'&&!seen[f.path]){seen[f.path]=1;cols.push(f.path);}});
    m.flags=flagList(r,rules).map(function(f){return f.text;}).join('; ');
    return m;
  });
  var all=lead.concat(cols).concat(['notes','flags']);
  var out=[all.map(csvCell).join(',')];
  rows.forEach(function(m){out.push(all.map(function(c){return csvCell(m[c]);}).join(','));});
  return'\ufeff'+out.join('\r\n')+'\r\n';
}

// ---- limits.json edits: ID-based, applied to the FRESH remote copy; first save seeds the starting rules ----
function planRuleEdits(remote,upserts,removes,defaults){
  var seeded=!remote.length,out=seeded?clone(defaults):remote.slice();
  var fromRemote=new Set(seeded?[]:remote),added=seeded?out.length:0,removed=0;
  upserts.forEach(function(u){
    var i=out.findIndex(function(r){return r.id===u.id;});
    if(i>=0){if(fromRemote.has(out[i])){removed++;added++;}out[i]=u;}
    else{out.push(u);added++;}
  });
  removes.forEach(function(id){
    var i=out.findIndex(function(r){return r.id===id;});
    if(i>=0){if(fromRemote.has(out[i]))removed++;else added--;out.splice(i,1);}
  });
  return{list:out,added:added,removed:removed};
}

<script>
(function() {
  'use strict';
  var $ = function(id) { return document.getElementById(id); };
  var TOKEN_KEY = 'oslu-token', ADMIN_KEY = 'oslu-admin', REFRESH_MS = 7 * 60 * 1000, LIMIT_BYTES = 700 * 1024;
  var S = { records: [], fileOf: {}, sizes: {}, rules: RULES, monthsLoaded: 3, lastOk: null, lastErr: null, loadedOnce: false, allMissing: false,
            nextAt: Date.now() + REFRESH_MS, admin: false, tab: 'over', loading: false, pendUp: {}, pendRm: {}, histShown: 100, rulesFromFile: false };
  try { S.admin = localStorage.getItem(ADMIN_KEY) === '1'; } catch (e) {}
  var toastTimer = null;
  function toast(msg, ms) { var t = $('toast'); t.textContent = msg; t.className = 'toast on'; clearTimeout(toastTimer); toastTimer = setTimeout(function() { t.className = 'toast'; }, ms || 3000); }
  var pad2 = function(n) { return String(n).padStart(2, '0'); };
  function fmtWhen(d) { return d ? d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ', ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '—'; }
  function shortDate(r) { var m = (r.meta || {}).date || ''; return m ? m.slice(5, 7) + '/' + m.slice(8, 10) : ''; }
  function monthFiles(n, now) {
    var out = [], y = now.getFullYear(), m = now.getMonth() + 1;
    for (var i = 0; i < n; i++) { out.push('data-' + y + '-' + pad2(m) + '.json'); m--; if (m === 0) { m = 12; y--; } }
    return out;
  }
  var LVL = { ok: ['✓', 'Within 24 h'], warn: ['!', 'Over 24 h'], late: ['✕', 'Over 48 h'], none: ['—', 'Not recorded'] };

  // ── LOAD ──────────────────────────────────────────────────────────────────
  async function load() {
    if (S.loading) return;
    S.loading = true; $('btn-refresh').disabled = true;
    try {
      if (!GH_TOKEN) { S.lastErr = { reason: 'notoken' }; return; }
      var files = monthFiles(S.monthsLoaded, new Date()), all = [], sizes = {}, fileOf = {}, missing = 0, fail = null;
      for (var i = 0; i < files.length; i++) {
        var r = await ghFetchRemote(files[i]);
        if (!r.ok) { fail = r; break; }
        if (r.missing) missing++;
        else { sizes[files[i]] = r.size || JSON.stringify(r.list).length; r.list.forEach(function(x) { if (x && x.id) { fileOf[x.id] = files[i]; all.push(x); } }); }
      }
      if (fail) { S.lastErr = fail; return; }                      // keep showing the last good data, but say so
      var lim = await ghFetchRemote('limits.json');
      if (lim.ok) { setRules(lim.list); S.rulesFromFile = lim.list.length > 0; S.rules = RULES; }
      S.records = sortRecords(all); S.fileOf = fileOf; S.sizes = sizes; S.allMissing = (missing === files.length);
      S.lastOk = Date.now(); S.lastErr = null; S.loadedOnce = true;
    } finally {
      S.loading = false; S.nextAt = Date.now() + REFRESH_MS; $('btn-refresh').disabled = false; render();
    }
  }

  // ── HEADER / BANNERS ──────────────────────────────────────────────────────
  function tick() {

    $('hmore').hidden = list.length <= S.histShown;
    var sz = Object.keys(S.sizes).sort().reverse().map(function(f) { return esc(f) + ': ' + Math.round(S.sizes[f] / 1024) + ' KB'; }).join(' · ');
    $('hfiles').innerHTML = S.admin ? 'Data files loaded: ' + (sz || 'none') : '';
  }
  async function deleteRound(id) {
    var r = S.records.filter(function(x) { return x.id === id; })[0], file = S.fileOf[id];
    if (!r || !file) { toast('That round is not in the loaded data. Refresh first.'); return; }
    var m = r.meta || {};
    if (!confirm('Delete the round from ' + m.date + ' (Round ' + m.round + ', ' + (m.operator || 'no name') + ')?\nThis cannot be undone.')) return;
    toast('Deleting…', 1500);
    var res = await ghDeleteById(file, id);
    if (res.ok) { toast(res.changed ? '✓ Round deleted' : 'That round was already gone'); load(); }
    else toast('⚠ Not deleted: ' + ghExplain(res), 6000);
  }
  function exportCsv() {
    var list = filteredHistory(); if (!list.length) { toast('Nothing to export'); return; }
    var blob = new Blob([recordsToCsv(list, S.rules)], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a'), d = new Date();
    a.href = URL.createObjectURL(blob); a.download = 'OSLU_PlantRounds_' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '.csv';
    document.body.appendChild(a); a.click(); setTimeout(function() { document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 1000);
    toast('✓ Exported ' + list.length + ' rounds');
  }

  // ── SETTINGS (flag limits, saved to limits.json) ──────────────────────────
  function effRule(r) { return S.pendUp[r.id] || r; }
  function rulesView() {
    var base = S.rules.filter(function(r) { return !S.pendRm[r.id]; }).map(effRule), have = {};
    S.rules.forEach(function(r) { have[r.id] = 1; });
    Object.keys(S.pendUp).forEach(function(id) { if (!have[id] && !S.pendRm[id]) base.push(S.pendUp[id]); });
    return base;
  }
  function numAttr(v) { return typeof v === 'number' ? v : ''; }
  function catalog() {
    var seen = {}, out = [], have = {};
    rulesView().forEach(function(r) { if (r.kind === 'range') have[r.path] = 1; });
    S.records.slice(0, 5).forEach(function(r) { flattenRec(r, '', []).forEach(function(f) {
      if (typeof f.value !== 'number' || /^meta\./.test(f.path) || /^schema$/.test(f.path)) return;
      var p = f.path.replace(/\[[^\]]*\]/g, '[*]'); if (!seen[p] && !have[p]) { seen[p] = 1; out.push(p); }
    }); });
    return out.sort();
  }
  function catLabel(p) {
    var sec = SECTIONS.filter(function(s) { return p.indexOf(s.path + '[*].') === 0 || (s.single && p.indexOf(s.path + '.') === 0); })[0];
    var key = p.split('.').pop();
    return sec ? sec.title + ' · ' + keyLabel(key) + (p.indexOf('[*]') >= 0 ? ' (every unit)' : '') : p.replace(/_/g, ' ').replace(/\./g, ' › ');
  }
  function guessUnit(p) { var k = p.split('.').pop(); return /temp|setpoint/.test(k) && !/ph/.test(k) ? '°F' : /psi|pressure/.test(k) ? 'psi' : /hz/.test(k) ? 'Hz' : /amps/.test(k) ? 'A' : /pct|valve|fire|status|demand|power/.test(k) ? '%' : /orp/.test(k) ? 'mV' : /cond/.test(k) ? 'µS/cm' : ''; }
  function renderSettings() {
    var rs = rulesView(), dis = S.admin ? '' : ' disabled', pend = Object.keys(S.pendUp).length + Object.keys(S.pendRm).length;
    var h = '<div class="card"><h2 class="t">Flag limits</h2><div class="pad note">These limits decide what is flagged on this dashboard and in the field app. Leave a box blank for no limit. They are saved in <b>limits.json</b> on the data branch; field iPads pick up changes the next time they sync. ' + (S.admin ? '' : '<b>Turn on Admin mode (top right) to edit.</b>') + '</div></div>';
    h += '<div class="card"><h2 class="w">Delivery vs setpoint · allowed difference</h2><div class="pad note">A reading is flagged when it is further below the setpoint than <b>Allowed below</b>, or further above than <b>Allowed above</b>. Units that are Off are skipped. Blank = not flagged yet (the difference is still shown).</div><div class="scrollx set"><table><thead><tr><th>Reading</th><th>Allowed below</th><th>Allowed above</th><th>Unit</th><th>On</th></tr></thead><tbody>';
    rs.filter(function(r) { return r.kind === 'delta'; }).forEach(function(r) {
      h += '<tr><td>' + esc(r.label) + '<br><code>' + esc(r.path) + '</code></td><td><input class="fld" type="number" step="0.1" min="0" data-id="' + esc(r.id) + '" data-f="below" value="' + numAttr(r.below) + '" aria-label="Allowed below setpoint, ' + esc(r.label) + '"' + dis + '></td><td><input class="fld" type="number" step="0.1" min="0" data-id="' + esc(r.id) + '" data-f="above" value="' + numAttr(r.above) + '" aria-label="Allowed above setpoint, ' + esc(r.label) + '"' + dis + '></td><td>' + esc(r.unit || '') + '</td><td><input type="checkbox" data-id="' + esc(r.id) + '" data-f="on"' + (r.on !== false ? ' checked' : '') + dis + ' aria-label="Enabled, ' + esc(r.label) + '"></td></tr>';
    });
    h += '</tbody></table></div></div><div class="card"><h2 class="c">Reading ranges · minimum and maximum</h2><div class="scrollx set"><table><thead><tr><th>Reading</th><th>Minimum</th><th>Maximum</th><th>Unit</th><th>On</th><th></th></tr></thead><tbody>';
    var rr = rs.filter(function(r) { return r.kind === 'range'; });
    rr.forEach(function(r) {
      h += '<tr><td>' + esc(r.label) + '<br><code>' + esc(r.path) + '</code></td><td><input class="fld" type="number" step="any" data-id="' + esc(r.id) + '" data-f="min" value="' + numAttr(r.min) + '" aria-label="Minimum, ' + esc(r.label) + '"' + dis + '></td><td><input class="fld" type="number" step="any" data-id="' + esc(r.id) + '" data-f="max" value="' + numAttr(r.max) + '" aria-label="Maximum, ' + esc(r.label) + '"' + dis + '></td><td><input class="fld" type="text" data-id="' + esc(r.id) + '" data-f="unit" value="' + esc(r.unit || '') + '" aria-label="Unit, ' + esc(r.label) + '"' + dis + '></td><td><input type="checkbox" data-id="' + esc(r.id) + '" data-f="on"' + (r.on !== false ? ' checked' : '') + dis + ' aria-label="Enabled, ' + esc(r.label) + '"></td><td><button class="btn" data-rm="' + esc(r.id) + '"' + dis + '>Remove</button></td></tr>';
    });
    if (!rr.length) h += '<tr><td colspan="6" class="empty">No range rules.</td></tr>';
    var cat = catalog();
    h += '</tbody></table></div><div class="filters"><label>Add a limit for another reading<select id="add-path" class="fld"' + dis + '>' + cat.map(function(p) { return '<option value="' + esc(p) + '">' + esc(catLabel(p)) + '</option>'; }).join('') + '</select></label><label>Minimum<input class="fld" id="add-min" type="number" step="any" style="width:100px"' + dis + '></label><label>Maximum<input class="fld" id="add-max" type="number" step="any" style="width:100px"' + dis + '></label><button class="btn" id="btn-add"' + dis + (cat.length ? '' : ' disabled') + '>Add limit</button></div></div>';
    h += '<div class="card"><div class="filters"><button class="btn pri" id="btn-save-rules"' + (S.admin && pend ? '' : ' disabled') + '>Save changes' + (pend ? ' (' + pend + ')' : '') + '</button><button class="btn" id="btn-discard"' + (pend ? '' : ' disabled') + '>Discard</button><span class="note">' + (S.rulesFromFile ? 'Using the saved limits.json.' : 'Using the starting limits. The first save creates limits.json.') + '</span></div></div>';
    $('p-set').innerHTML = h;
  }
  function stage(id, f, raw) {
    var cur = rulesView().filter(function(r) { return r.id === id; })[0]; if (!cur) return;
    var n = JSON.parse(JSON.stringify(cur));
    if (f === 'on') n.on = raw; else if (f === 'unit') n.unit = raw; else n[f] = raw === '' ? null : parseFloat(raw);
    S.pendUp[id] = n; updateSaveBtn();                      // no re-render: keeps keyboard focus while tabbing through the table
  }
  function updateSaveBtn() {
    var pend = Object.keys(S.pendUp).length + Object.keys(S.pendRm).length, b = $('btn-save-rules'), d = $('btn-discard');
    if (b) { b.disabled = !(S.admin && pend); b.textContent = 'Save changes' + (pend ? ' (' + pend + ')' : ''); }
    if (d) d.disabled = !pend;
  }
  async function saveRules() {
    var ups = Object.keys(S.pendUp).map(function(k) { return S.pendUp[k]; }).filter(function(r) { return !S.pendRm[r.id]; }), rms = Object.keys(S.pendRm);
    for (var i = 0; i < ups.length; i++) {
      var r = ups[i];
      if (r.kind === 'range' && typeof r.min === 'number' && typeof r.max === 'number' && r.min > r.max) { toast('⚠ Minimum is larger than maximum for ' + r.label, 5000); return; }
      if (r.kind === 'delta' && ((typeof r.below === 'number' && r.below < 0) || (typeof r.above === 'number' && r.above < 0))) { toast('⚠ Allowed differences cannot be negative (' + r.label + ')', 5000); return; }
    }
    $('btn-save-rules').disabled = true;
    var res = await ghMutate('limits.json', function(rem) { return planRuleEdits(rem, ups, rms, DEFAULT_RULES); }, 'Update flag limits');
    if (res.ok) { S.pendUp = {}; S.pendRm = {}; toast('✓ Limits saved'); load(); }
    else { toast('⚠ Not saved: ' + ghExplain(res), 6000); renderSettings(); }
  }

  // ── RENDER ────────────────────────────────────────────────────────────────
  function render() {
    renderBanner(); renderAlerts();
    $('btn-admin').textContent = 'Admin mode: ' + (S.admin ? 'on' : 'off'); $('btn-admin').className = 'tbtn' + (S.admin ? ' on' : ''); $('btn-admin').setAttribute('aria-pressed', S.admin ? 'true' : 'false');
    renderOverview(); renderEquipment(); renderHistory(); renderSettings(); tick();
  }
  function showTab(t) {
    S.tab = t;
    ['over', 'equip', 'hist', 'set'].forEach(function(x) { $('p-' + x).classList.toggle('act', x === t); document.querySelector('.tab[data-t=' + x + ']').classList.toggle('act', x === t); });
  }

  // ── EVENTS ────────────────────────────────────────────────────────────────
  document.querySelectorAll('.tab').forEach(function(b) { b.addEventListener('click', function() { showTab(b.getAttribute('data-t')); window.scrollTo(0, 0); }); });
  $('btn-refresh').addEventListener('click', function() { load(); });
  $('btn-admin').addEventListener('click', function() { S.admin = !S.admin; try { localStorage.setItem(ADMIN_KEY, S.admin ? '1' : '0'); } catch (e) {} render(); toast(S.admin ? 'Admin mode on: delete and limit editing enabled' : 'Admin mode off'); });
  ['f-from', 'f-to', 'f-round', 'f-op', 'f-q', 'f-flags'].forEach(function(id) { $(id).addEventListener('input', function() { S.histShown = 100; renderHistory(); }); $(id).addEventListener('change', function() { S.histShown = 100; renderHistory(); }); });
  $('hmore').addEventListener('click', function() { S.histShown += 100; renderHistory(); });
  $('btn-csv').addEventListener('click', exportCsv);
  $('btn-older').addEventListener('click', function() { S.monthsLoaded++; toast('Loading ' + S.monthsLoaded + ' months…', 1500); load(); });
  $('hbody').addEventListener('click', function(e) { var id = e.target.getAttribute && e.target.getAttribute('data-del'); if (id) deleteRound(id); });
  $('p-set').addEventListener('change', function(e) {
    var t = e.target, id = t.getAttribute('data-id'), f = t.getAttribute('data-f'); if (!id || !f || !S.admin) return;
    stage(id, f, f === 'on' ? t.checked : t.value);
  });
  $('p-set').addEventListener('click', function(e) {
    var t = e.target;
    if (t.id === 'btn-save-rules') saveRules();
    else if (t.id === 'btn-discard') { S.pendUp = {}; S.pendRm = {}; renderSettings(); }
    else if (t.getAttribute('data-rm') && S.admin) { S.pendRm[t.getAttribute('data-rm')] = 1; renderSettings(); }
    else if (t.id === 'btn-add' && S.admin) {
      var p = $('add-path').value, mn = $('add-min').value, mx = $('add-max').value; if (!p) return;
      if (mn === '' && mx === '') { toast('Enter a minimum, a maximum, or both'); return; }
      var rule = { id: 'r-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), kind: 'range', label: catLabel(p), path: p, min: mn === '' ? null : parseFloat(mn), max: mx === '' ? null : parseFloat(mx), unit: guessUnit(p), on: true };
      S.pendUp[rule.id] = rule; renderSettings();
    }
  });
  function openTok() { $('tok-state').textContent = GH_TOKEN ? 'A token is saved in this browser (ends in …' + GH_TOKEN.slice(-4) + ').' : 'No token is saved in this browser yet.'; $('tok-in').value = ''; $('tokmodal').hidden = false; $('tok-in').focus(); }
  function closeTok() { $('tokmodal').hidden = true; $('tok-in').value = ''; }
  $('btn-token').addEventListener('click', openTok); $('tok-close').addEventListener('click', closeTok);
  $('tok-save').addEventListener('click', function() {
    var t = $('tok-in').value.trim(); if (t.length < 20) { toast('⚠ That does not look like a token'); return; }
    try { localStorage.setItem(TOKEN_KEY, t); } catch (e) { toast('⚠ Could not store the token in this browser'); return; }
    GH_TOKEN = t; closeTok(); S.lastErr = null; toast('✓ Token saved'); load();
  });
  $('tok-clear').addEventListener('click', function() { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} GH_TOKEN = ''; closeTok(); render(); });
  document.addEventListener('visibilitychange', function() { if (document.visibilityState === 'visible' && S.lastOk && Date.now() - S.lastOk > REFRESH_MS) load(); });

  // ── START ─────────────────────────────────────────────────────────────────
  $('ver').textContent = DASH_VERSION;
  showTab('over'); render();
  setInterval(tick, 1000);
  if (GH_TOKEN) load();
})();
</script>
</body>
</html>
